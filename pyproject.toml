[project]
name = "iceberg-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vanalex", email = "apjorquera@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.111",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyiceberg>=0.12.0",
    "pyspark[connect]==4.0.1",
    "trino>=0.340.0",
]

[project.scripts]
iceberg-lab = "iceberg_lab:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
