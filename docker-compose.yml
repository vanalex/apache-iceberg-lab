services:
  # Verify Docker VM has enough memory for the full stack
  check-resources:
    image: alpine:3.24.2
    container_name: check-resources
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        total_kb=$$(awk '/MemTotal/ {print $$2}' /proc/meminfo)
        total_gb=$$((total_kb / 1024 / 1024))
        required_gb=16
        echo "Docker VM memory: $${total_gb} GB ($${total_kb} kB)"
        if [ "$$total_gb" -lt "$$required_gb" ]; then
          echo "WARNING: At least $${required_gb} GB recommended."
          echo "Increase memory in Docker Desktop > Settings > Resources."
          echo "Continuing anyway — some services may run out of memory."
        else
          echo "Memory check passed."
        fi
    networks:
      - iceberg-net

  # MinIO - S3-compatible object storage
  # Silo is pgsty's community MinIO build; official MinIO images are no longer published
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    depends_on:
      check-resources:
        condition: service_completed_successfully
    networks:
      - iceberg-net
    healthcheck:
      test: ["CMD", "curl", "http://127.0.0.1:9000/minio/health/live"]
      interval: 1s
      timeout: 10s

  # Keycloak - OIDC identity provider for Polaris (https://polaris.apache.org/guides/keycloak/)
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always carry iss=http://localhost:8080/realms/iceberg, whether requested from the
      # host (localhost:8080) or from containers (keycloak:8080), so Polaris accepts both
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/iceberg-realm.json:/opt/keycloak/data/import/iceberg-realm.json:ro
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    networks:
      - iceberg-net
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 30

  # Polaris Iceberg REST Catalog (following official Apache guide)
  polaris:
    image: apache/polaris:1.8.0
    container_name: polaris-catalog
    ports:
      - "8181:8181"
      - "5005:5005"
    environment:
      JAVA_DEBUG: "true"
      JAVA_DEBUG_PORT: "*:5005"
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      # Bootstrap credentials: REALM,CLIENT_ID,CLIENT_SECRET
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cr3t"
      polaris.realm-context.realms: "POLARIS"
      quarkus.otel.sdk.disabled: "true"
      # Authenticate with Keycloak-issued tokens only (Polaris' own token endpoint is disabled)
      polaris.authentication.type: external
      quarkus.oidc.tenant-enabled: "true"
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/iceberg
      quarkus.oidc.client-id: client1
      quarkus.oidc.roles.role-claim-path: principal_roles
      polaris.oidc.principal-mapper.id-claim-path: principal_id
      polaris.oidc.principal-mapper.name-claim-path: principal_name
      polaris.oidc.principal-roles-mapper.mappings[0].regex: (.+)
      polaris.oidc.principal-roles-mapper.mappings[0].replacement: PRINCIPAL_ROLE:$$1
    volumes:
      - ./data/polaris:/var/polaris
    depends_on:
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - iceberg-net
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s

  # Setup MinIO bucket
  setup_bucket:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z  # bundles mc
    container_name: setup-minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - >-
        echo Creating MinIO bucket...;
        mc alias set pol http://minio:9000 admin password;
        mc mb pol/warehouse || true;
        mc ls pol;
        echo Bucket setup complete.
    networks:
      - iceberg-net

  # Setup Polaris catalog
  polaris-setup:
    image: alpine/curl:8.22.0
    container_name: setup-polaris
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      # Keycloak client (maps to Polaris principal root)
      - CLIENT_ID=client1
      - CLIENT_SECRET=s3cr3t
    volumes:
      - ./polaris:/setup
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - >-
        apk add --no-cache jq;
        chmod +x /setup/*.sh;
        /setup/bootstrap-catalog.sh;
    networks:
      - iceberg-net

networks:
  iceberg-net:
    driver: bridge
